# hello-optimize — a CLI agent whose system prompt is deliberately short,
# so the active optimizer has something to improve.
#
# dataset.jsonl is the contract: every expected_output is the machine
# line `capital=<City>`, graded with exact_match. This prompt never
# mentions that format, so the baseline scores 0.000 — correct prose
# that no pipeline can parse.
#
# Run it from THIS directory (the starter is self-contained):
#
#   crewhaus optimize crewhaus.yaml --dataset dataset.jsonl \
#     --graders graders.yaml --iterations 3 --mutator claude
#
# Measured on CLI 0.4.0: 0.000 → 1.000 on the dev split. Add
# --write-back to apply the winner here. The default rule-based mutator
# only appends canned edits and stays at 0.000 — see README.md.

target: cli
name: hello-optimize
agent:
  model: claude-sonnet-5
  # Deliberately terse — the optimizer should expand this.
  instructions: Answer the user's question.
tools: []
