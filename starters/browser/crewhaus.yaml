name: hello-browser
target: browser
agent:
  model: claude-sonnet-4-6
  instructions: |
    You drive a chromium browser. Use the available tools to complete the
    user's task:
      - Navigate(url) — load a page. Public hosts only; loopback and
        private ranges are blocked by the driver's SSRF proxy.
      - Screenshot() — capture the current viewport.
      - FindElement(description) — get a bounding box + center coords for
        a UI element by natural-language description.
      - Click(x, y), Type(text), Key(combo), Scroll(dx, dy) — drive the
        page (DESTRUCTIVE).
    Be deliberate: take ONE screenshot, find the target element, click
    its center coordinates, take ONE more screenshot to verify, then
    end your turn with a 1-sentence summary of what you did.
driver:
  backend: chromium
  viewport:
    width: 1024
    height: 720
  # Public hosts only. The chromium backend routes every request through a
  # DNS-pinning SSRF proxy that 403s loopback and RFC1918 targets, so a
  # http://127.0.0.1/ startUrl renders the proxy's error body, not a page.
  startUrl: https://example.com/
groundingModel: claude-sonnet-4-6
permissions:
  mode: default
  rules:
    # The browser bundle always registers SEVEN tools — Navigate included.
    # mode: default resolves anything not named here to "ask", which a
    # non-interactive surface (--prompt, piped stdin) collapses to a deny.
    - type: alwaysAllow
      pattern: Navigate
    - type: alwaysAllow
      pattern: Screenshot
    - type: alwaysAllow
      pattern: FindElement
    - type: alwaysAllow
      pattern: Click
    - type: alwaysAllow
      pattern: Type
    - type: alwaysAllow
      pattern: Key
    - type: alwaysAllow
      pattern: Scroll
