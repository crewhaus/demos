name: hello-rag
target: pipeline
agent:
  model: claude-sonnet-4-6
  instructions: |
    You are a RAG-grounded assistant. For every question, call the
    `Retrieve` tool first to fetch relevant context from the vector
    store, then answer in 2–3 sentences citing the retrieved chunks
    by `[N]` reference number. If the retrieved chunks don't cover the
    question, say "I can only answer questions about the indexed docs"
    — do NOT improvise from outside the retrieval results.
retrieve:
  embedderModel: mock/det
  vectorBackend: in-memory
  # Keep defaultK well under the chunk count the bundle prints at boot
  # (`[pipeline] indexed N chunks`) — a k near N is not a filter.
  defaultK: 2
permissions:
  mode: default
  rules:
    - type: alwaysAllow
      pattern: Retrieve
indexing:
  chunkStrategy: fixed
  chunkSize: 400
  chunkOverlap: 0
  documents:
    - id: target-shapes
      text: |
        CrewHaus Factory compiles one spec into one of fourteen
        target harness shapes: cli, workflow, channel, graph,
        managed, pipeline, crew, research, batch, voice, browser,
        eval, onchain and onchain-game. Every one has a compiler
        emitter today; `crewhaus lint` rejects any other value for
        `target:`.
    - id: run-vs-compile
      text: |
        Only the cli and browser shapes run straight from the spec
        with `crewhaus run`. Every other shape is compile-first:
        `crewhaus compile spec.yaml -o dist --check` asserts the
        emitted bundle, installs its dependencies and boots it, and
        `bun dist/agent.ts` runs it. Pointing `crewhaus run` at a
        compile-only shape exits 1.
    - id: retrieval-knobs
      text: |
        Retrieval quality is configuration, not code. chunkStrategy
        picks fixed, semantic or markdown boundaries; chunkSize and
        chunkOverlap decide how the corpus is cut up; embedderModel
        selects the provider (mock/det offline, or openai/, voyage/,
        cohere/, gemini/, local/); vectorBackend picks the store
        (in-memory, lance, qdrant, pinecone, weaviate); defaultK sets
        how many chunks each Retrieve call returns. The optimizer
        treats chunkSize, chunkOverlap and defaultK as tunable
        parameters, so an eval can search them.
    - id: section-18
      text: |
        Section 18 lands the production safety floor: sandbox (docker
        backend with image allowlist, network=none default, read-only
        root, /tmp tmpfs), tool-code-execution (Python, JavaScript,
        Shell tools that require a sandbox), and prompt-injection
        detector (regex + structural + optional LLM tier hooked into
        runtime-core's post-tool path).
    - id: section-19
      text: |
        Section 19 lands the GRPH target shape: checkpoint-store
        (file-backed JSONL), graph-engine (builder + interpreter with
        HITL pauses), branch-history (branchAt + diff), durable-
        execution (idempotency keys), and target-graph codegen.
    - id: section-20
      text: |
        Section 20 lands the MGD target shape and governance:
        gateway-protocol (JSON-RPC v1), tenancy (per-tenant storage
        rebase via AsyncLocalStorage), audit-log (hash-chained JSONL),
        policy-engine (sideEffect classification), gateway-server
        (Bun.serve with HS256 JWT), and target-managed codegen.
