# hello-expert (daemon) — the SAME self-teaching expert as crewhaus.yaml,
# compiled to an always-on Slack daemon. Two things change versus the cli:
#
#   1. heartbeat + `learning.study.on_heartbeat` — every 6h a tick fires and
#      the daemon runs an unattended study pass. The rotation policy (gaps
#      first, ~3 STUDY : 1 REFLECT, bounded per tick) ships with CrewHaus
#      and is baked ahead of the operator instructions below at compile time
#      — HEARTBEAT.md documents it, nothing re-implements it.
#   2. channel — it answers questions in Slack threads, and 👍/👎 reactions
#      on its replies become rating signal for the flywheel.
#
# NOTE (v0.3.0): the one-knob `thredz:` backend is emit-wired on the cli
# shape only in this release — the channel shape carries it but keeps local
# files. This daemon therefore learns into the LOCAL wiki
# (.crewhaus/wiki/hello-expert-daemon/). When channel thredz wiring lands,
# `memory.wiki` below becomes `thredz: true` and the two shapes share one
# hosted brain again.
#
# Usage (from inside this directory):
#   cp .env.example .env   # ANTHROPIC_API_KEY + SLACK_*
#   bunx crewhaus run daemon.yaml
# For a fast local heartbeat while testing, drop `heartbeat.every` to "5m".

name: hello-expert-daemon
target: channel

memory:
  wiki: { enabled: true, autoRecall: true } # the daemon's local wiki brain

learning:
  domain: specialty coffee brewing & extraction science
  curriculum: curriculum.md
  sources: ["sca.coffee", "*.edu", "baristahustle.com"]
  # study.on_heartbeat defaults ON: every heartbeat tick doubles as a
  # study/reflect tick per the built-in rotation.

agent:
  model: claude-sonnet-4-6
  model_fallbacks: [claude-haiku-4-5-20251001]
  instructions: |
    You are the resident specialty-coffee expert answering in Slack threads.
    Keep answers to 1-3 sentences unless asked for depth, and reply
    in-thread. Precision over fluency: grind size, brew ratios, extraction
    yields, TDS, and water chemistry are load-bearing numbers — get them
    right, with units, or say you are unsure. Prefer SCA standards and
    peer-reviewed extraction science; treat blogs and forums as leads to
    verify, not sources. Local field notes live in sources/.
  sub_agents:
    researcher:
      description: |
        Read-only source researcher. Give it ONE narrow sub-question. It
        searches/fetches high-quality sources and returns 2-4 verbatim,
        cited snippets — no synthesis. Hard cap: 180 words.
      instructions: |
        You research ONE narrow question against high-quality sources.
        Prefer primary literature, standards bodies, and canonical texts.
        Return 2-4 SHORT verbatim snippets, each with its source, and one
        line on time-tested vs frontier. Do NOT synthesise. Under 180 words.
      tools: [webSearch, webFetch, read]
      model: claude-haiku-4-5-20251001
      permissions:
        allow: [WebSearch, WebFetch, Read]
        deny: []
  tools: [read, edit, webSearch, webFetch, todoWrite]

# One inbound message = one agent turn; isolate sessions per Slack thread.
channels:
  slack:
    botToken: $SLACK_BOT_TOKEN
    signingSecret: $SLACK_SIGNING_SECRET
routing:
  sessionKey: thread

# The scheduled learning cadence. The built-in study rotation is prepended
# to these instructions at compile time (learning.study.on_heartbeat).
heartbeat:
  every: 6h
  instructions: |
    Do the pass the rotation selects, then log a one-line result. If there
    is genuinely nothing useful to do this tick, log `heartbeat: idle`.

# 👍/👎 on the bot's replies become rating signal for the flywheel.
feedback:
  channelReactions: true
  autoDistill: true

# A tiny status page for the daemon (health, turn counts, heartbeat ticks).
gateway:
  port: 4173
  ui: true

permissions:
  mode: default
  rules:
    - { type: alwaysAllow, pattern: Read }
    - { type: alwaysAllow, pattern: WebSearch }
    - { type: alwaysAllow, pattern: WebFetch }
    - { type: alwaysAllow, pattern: TodoWrite }
    - { type: alwaysAllow, pattern: wiki_recall }
    - { type: alwaysAllow, pattern: wiki_semantic_search }
    - { type: alwaysAllow, pattern: wiki_search }
    - { type: alwaysAllow, pattern: wiki_get }
    - { type: alwaysAllow, pattern: wiki_list }
    - { type: alwaysAllow, pattern: wiki_related }
    - { type: alwaysAllow, pattern: wiki_stats }
    - { type: alwaysAllow, pattern: wiki_write }
    - { type: alwaysAllow, pattern: wiki_set_signals }
    - { type: alwaysAllow, pattern: log_knowledge_gap }
    - { type: alwaysAllow, pattern: Edit(curriculum.md) }
    - { type: alwaysAllow, pattern: Edit(eval/**) }
    - { type: alwaysAllow, pattern: Edit(sources/**) }
